name: Check code
on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'study.json'
      - 'package.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - name: Validate report reconstruction on the hosted runtime
        run: npm run analyse
      - run: npm run verify
